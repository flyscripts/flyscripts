<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pati Karnem</title>
<link rel="stylesheet" href="style.css">
<script src="lang.js"></script>
</head>
<body class="tr">
<!--
  Firebase e-posta bağlantılarının açtığı sayfa (Authentication → Templates → Customize action URL).
  Bağlantı ?mode=verifyEmail|resetPassword|recoverEmail&oobCode=…&apiKey=…&lang=tr|en ile gelir.
  Firebase JS SDK (Apache 2.0) Google'ın kendi CDN'inden yüklenir.
-->
<div class="wrap">
  <div class="hero">
    <div class="brand">Pati Karnem</div>
    <h1 id="title">…</h1>
  </div>
  <div class="card status" id="box">
    <div class="icon" id="icon">🐾</div>
    <p id="msg"></p>
    <div id="form" hidden>
      <input type="password" id="pw" autocomplete="new-password" minlength="6">
      <input type="password" id="pw2" autocomplete="new-password" minlength="6">
      <button class="btn" id="save"></button>
    </div>
  </div>
  <footer>© 2026 flyscripts app studios · <a href="gizlilik.html" id="privacy"></a></footer>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, applyActionCode, verifyPasswordResetCode, confirmPasswordReset, checkActionCode }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const p = new URLSearchParams(location.search);
const lang = p.get('lang') === 'en' ? 'en' : (p.get('lang') === 'tr' ? 'tr' : (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en');
document.body.classList.remove('tr', 'en'); document.body.classList.add(lang); document.documentElement.lang = lang;

const T = {
  tr: {
    verifyTitle: 'E-postan onaylanıyor…', verifiedTitle: 'E-postan onaylandı! 🎉',
    verified: 'Harika! Şimdi Pati Karnem’e dönüp dostlarını eklemeye başlayabilirsin.',
    resetTitle: 'Yeni şifre belirle', resetFor: (e) => `${e} hesabı için yeni şifreni yaz.`,
    pw: 'Yeni şifre (en az 6 karakter)', pw2: 'Yeni şifre (tekrar)', save: 'Şifreyi kaydet',
    mismatch: 'Şifreler aynı değil.', short: 'Şifre en az 6 karakter olmalı.', weak: 'Şifre çok zayıf, daha uzun bir şifre seç.',
    resetDone: 'Şifren değişti! 🔐', resetDoneBody: 'Pati Karnem’e dönüp yeni şifrenle giriş yapabilirsin.',
    recoverTitle: 'E-posta adresin geri alındı', recoverBody: 'Hesabının e-posta adresi eski haline döndü. Güvenliğin için şifreni de değiştirmeni öneririz.',
    badTitle: 'Bu bağlantı artık geçerli değil', bad: 'Bağlantının süresi dolmuş ya da daha önce kullanılmış olabilir. Uygulamadan yeni bir e-posta isteyebilirsin.',
    privacy: 'Gizlilik Politikası',
  },
  en: {
    verifyTitle: 'Confirming your email…', verifiedTitle: 'Your email is confirmed! 🎉',
    verified: 'Great! Head back to Pati Karnem and start adding your pets.',
    resetTitle: 'Set a new password', resetFor: (e) => `Enter a new password for ${e}.`,
    pw: 'New password (at least 6 characters)', pw2: 'New password (again)', save: 'Save password',
    mismatch: "Passwords don't match.", short: 'Password must be at least 6 characters.', weak: 'Password is too weak, pick a longer one.',
    resetDone: 'Password changed! 🔐', resetDoneBody: 'Go back to Pati Karnem and sign in with your new password.',
    recoverTitle: 'Your email was restored', recoverBody: "Your account's email address was changed back. We recommend changing your password too.",
    badTitle: 'This link is no longer valid', bad: 'It may have expired or already been used. You can request a new email from the app.',
    privacy: 'Privacy Policy',
  },
}[lang];

const $ = (id) => document.getElementById(id);
$('privacy').textContent = T.privacy;
$('privacy').href = 'gizlilik.html?lang=' + lang;
function show(title, icon, msg, cls) {
  $('title').textContent = title; $('icon').textContent = icon; $('msg').textContent = msg;
  $('msg').className = cls || '';
}

const mode = p.get('mode'), code = p.get('oobCode'), apiKey = p.get('apiKey');
if (!mode || !code || !apiKey) {
  show(T.badTitle, '🙀', T.bad, 'err');
} else {
  const auth = getAuth(initializeApp({ apiKey }));
  auth.languageCode = lang;
  try {
    if (mode === 'verifyEmail') {
      show(T.verifyTitle, '⏳', '');
      await applyActionCode(auth, code);
      show(T.verifiedTitle, '✅', T.verified, 'ok');
    } else if (mode === 'resetPassword') {
      const email = await verifyPasswordResetCode(auth, code);
      show(T.resetTitle, '🔑', T.resetFor(email));
      $('pw').placeholder = T.pw; $('pw2').placeholder = T.pw2; $('save').textContent = T.save;
      $('form').hidden = false;
      $('save').onclick = async () => {
        const a = $('pw').value, b = $('pw2').value;
        if (a.length < 6) return show(T.resetTitle, '🔑', T.short, 'err');
        if (a !== b) return show(T.resetTitle, '🔑', T.mismatch, 'err');
        $('save').disabled = true;
        try {
          await confirmPasswordReset(auth, code, a);
          $('form').hidden = true;
          show(T.resetDone, '✅', T.resetDoneBody, 'ok');
        } catch (e) {
          $('save').disabled = false;
          if (e.code === 'auth/weak-password') show(T.resetTitle, '🔑', T.weak, 'err');
          else { $('form').hidden = true; show(T.badTitle, '🙀', T.bad, 'err'); }
        }
      };
    } else if (mode === 'recoverEmail') {
      await checkActionCode(auth, code);
      await applyActionCode(auth, code);
      show(T.recoverTitle, '✅', T.recoverBody, 'ok');
    } else {
      show(T.badTitle, '🙀', T.bad, 'err');
    }
  } catch (e) {
    show(T.badTitle, '🙀', T.bad, 'err');
  }
}
</script>
</body>
</html>
